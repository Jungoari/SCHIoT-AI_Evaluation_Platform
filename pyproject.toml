[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # assert 허용, 한글 메시지가 긴 줄은 허용

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/conftest.py" = ["S105", "S106"]
# 로컬 도구 스크립트(녹화·발표 생성·부하 테스트): 고정된 명령만 실행하고 외부 입력을 받지 않음
"scripts/**" = ["S603", "S607", "S310", "E702", "E741", "S110"]
