{% load static %}
<!-- 작은 화면용 상단 바 (사이드바 대신) -->
<div class="flex items-center gap-3 bg-surface px-5 py-3 shadow-[var(--shadow-card)] lg:hidden">
  <a href="{% url 'core:dashboard' %}" class="flex items-center gap-2.5">
    <img src="{% static 'img/sch-logo.png' %}" alt="순천향대학교 SCH 로고" class="h-7 w-auto">
    <span class="font-extrabold">{{ SITE_NAME }}</span>
  </a>
  <nav class="ml-auto flex items-center gap-1 text-sm">
    <a href="{% url 'core:dashboard' %}" class="btn-ghost px-3 py-2">대시보드</a>
    <a href="{% url 'accounts:join' %}" class="btn-ghost px-3 py-2">대회 추가</a>
    <a href="{{ request.path }}?tutorial=1" class="btn-ghost px-3 py-2">안내</a>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="btn-ghost px-3 py-2">로그아웃</button></form>
  </nav>
</div>
