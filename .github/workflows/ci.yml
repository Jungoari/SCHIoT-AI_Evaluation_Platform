# 커밋마다 테스트·린트·보안 검사 자동 실행
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: evalplatform
          POSTGRES_USER: evalplatform
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalplatform" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      RQ_EAGER: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: web/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 린트
        run: ruff check .
      - name: 보안 정적 분석 (bandit)
        run: bandit -q -r apps config -x '*/tests/*,*/migrations/*'
      - name: 의존성 취약점 (pip-audit)
        run: pip-audit -r requirements.txt || true
      - name: 마이그레이션 누락 확인
        run: python manage.py makemigrations --check --dry-run
      - name: 테스트
        run: pytest -p no:warnings
